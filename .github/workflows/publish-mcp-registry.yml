name: Publish to MCP Registry

# Publishes ./server.json (the hosted AgentPact MCP server, remote-only,
# streamable-http at https://mcp.agentpact.xyz/mcp) to the official MCP
# Registry, https://registry.modelcontextprotocol.io.
#
# Auth is GitHub OIDC: `mcp-publisher login github-oidc` exchanges this job's
# OIDC token for a registry token scoped to io.github.<repository_owner>/*,
# i.e. io.github.adamkrawczyk/*. No secret is stored.
#
# Manual only (workflow_dispatch). Registry versions are immutable: bump
# "version" in package.json AND server.json together (test/smoke.mjs pins them
# equal) before every new publish; re-publishing an existing version is rejected.
#
#   gh workflow run publish-mcp-registry.yml --repo adamkrawczyk/agentpact-mcp-server --ref main
#
# Copied from wisechef-ai/loopskill-api publish-mcp-registry.yml (PR #393).
# Docs: https://github.com/modelcontextprotocol/registry/blob/main/docs/modelcontextprotocol-io/github-actions.mdx

on:
  workflow_dispatch:

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

env:
  # Pinned release + the sha256 of its linux_amd64 tarball (from the release's
  # registry_<ver>_checksums.txt). Bump both together.
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  publish:
    name: Validate and publish server.json
    runs-on: ubuntu-latest
    # Publishing from a non-default ref would let an unreviewed branch push to
    # the registry under the owner namespace.
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write # required for `mcp-publisher login github-oidc`
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher (pinned, checksum-verified)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
